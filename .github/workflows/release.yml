# Publish a release to GitHub Pages when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Each release stays available at <site>/v1.2.0/; the site root serves the newest
# stable release (see scripts/publish-pages.sh).
# One-time setup: Settings → Pages → Source: "Deploy from a branch", branch gh-pages, folder / (root).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # push to the gh-pages branch

concurrency:
  group: pages-release
  cancel-in-progress: false # never drop a release half-way

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
      - name: Publish to the gh-pages branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/publish-pages.sh "$GITHUB_REF_NAME" dist
